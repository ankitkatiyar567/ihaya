<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff8ec">
<title>Ihaaya has moved</title>
<style>
:root{--bg:#fff8ec;--ink:#2d2350;--muted:#6c6488}
@media (prefers-color-scheme: dark){:root{--bg:#17142b;--ink:#f4efff;--muted:#b9b0d8}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);text-align:center;padding:24px;box-sizing:border-box;
  font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","Segoe UI",system-ui,sans-serif}
.logo{font-size:64px;line-height:1}
h1{margin:10px 0 4px;font-size:30px}
p{color:var(--muted);max-width:420px;margin:10px auto;line-height:1.4}
.btn{display:block;width:100%;max-width:320px;margin:14px auto;padding:16px;border:0;border-radius:18px;font:inherit;font-size:18px;font-weight:800;
  color:#fff;background:linear-gradient(90deg,#7c4dff,#ff5fa2);text-decoration:none;cursor:pointer;box-sizing:border-box}
.addr{color:#7c4dff;font-weight:800;font-size:18px;word-break:break-all}
.btn.save{background:#ffb800;color:#2d2350}
</style>
</head>
<body>
<main>
  <div class="logo">⭐</div>
  <h1>Ihaaya has moved</h1>
  <p>The app now lives at<br><a class="addr" href="https://ankitkatiyar567.github.io/ihaaya/">ankitkatiyar567.github.io/ihaaya</a></p>
  <div id="hasData" hidden>
    <p>This phone has stars saved here. Save them first. Then open the new Ihaaya, add it to the Home Screen, and in the parent menu choose ⚙️ Settings → ⬆️ Restore backup.</p>
    <button class="btn save" id="save" type="button">💾 Save the stars (backup)</button>
  </div>
  <a class="btn" href="https://ankitkatiyar567.github.io/ihaaya/">Open the new Ihaaya</a>
</main>
<script>
(() => {
  const NEW = 'https://ankitkatiyar567.github.io/ihaaya/';
  // The old app's offline copy would keep showing old pages: remove it.
  try {
    if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations()
      .then(rs => rs.forEach(r => { if (/\/ihaya\/$/.test(r.scope)) r.unregister(); }));
  } catch (e) { /* nothing to remove */ }
  let data = null;
  try { data = localStorage.getItem('star-chart-v3') || localStorage.getItem('ihanaa-star-chart-v2'); } catch (e) { /* no storage */ }
  if (!data) { location.replace(NEW); return; }   // nothing saved here: go straight to the new address
  document.getElementById('hasData').hidden = false;
  document.getElementById('save').addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    a.download = 'star-chart-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
  });
})();
</script>
</body>
</html>
